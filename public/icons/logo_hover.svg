<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 52 486 296" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- hide the C only inside the B, so its lines end exactly on the B outline -->
    <mask id="behindB" maskUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="400">
      <rect x="-50" y="-50" width="600" height="400" fill="#fff"/>
      <path d="M0,0 H118 A50,50 0 0 1 118,100 A50,50 0 0 1 118,200 H0 Z" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(88,70) scale(1.3)" fill="none" stroke="#3DCFB6" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10">
    <g mask="url(#behindB)">
      <!-- outer C band -->
      <path d="M298.9,25.7 A100,100 0 1 0 298.9,174.3 L284.2,158.0 A78,78 0 1 1 284.2,42.0 Z"/>
      <!-- small c, now closed into a ring section -->
      <path d="M293.5,52.0 A78,78 0 1 0 293.5,148.0 L274.6,133.2 A54,54 0 1 1 274.6,66.8 Z"/>
    </g>
    <!-- B -->
    <path d="M0,0 H118 A50,50 0 0 1 118,100 A50,50 0 0 1 118,200 H0 Z
             M22,22 H118 A28,28 0 0 1 118,78 H22 Z
             M22,122 H118 A28,28 0 0 1 118,178 H22 Z" fill="none" stroke="none"/>
    <path d="M0,0 H118 A50,50 0 0 1 118,100 A50,50 0 0 1 118,200 H0 Z"/>
    <path d="M22,22 H118 A28,28 0 0 1 118,78 H22 Z"/>
    <path d="M22,122 H118 A28,28 0 0 1 118,178 H22 Z"/>
    <path d="M0,100 H118"/>
  </g>
</svg>

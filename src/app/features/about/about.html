<section class="about" id="about">
  <div class="about-inner">
    <div class="about-image">
      <img src="images/about_photo_hover.svg" alt="" class="hatch-decoration" />
      <img src="images/about-photo.jpg" alt="Berk Çapacı" class="about-photo" />
    </div>

    <div class="about-content">
      <span class="about-eyebrow">{{ 'about.eyebrow' | translate }}</span>
      <div class="about-card">
        <h2 class="about-title">{{ 'about.title' | translate }}</h2>

        <div class="about-body">
          <p class="about-text">{{ 'about.text' | translate }}</p>

          <ul class="about-points">
            <li>
              <img src="icons/pin.svg" alt="" />
              <span>{{ 'about.points.location' | translate }}</span>
            </li>
            <li>
              <img src="icons/cognition.svg" alt="" />
              <span>{{ 'about.points.learning' | translate }}</span>
            </li>
            <li>
              <img src="icons/new_releases.svg" alt="" />
              <span>{{ 'about.points.problemSolving' | translate }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>

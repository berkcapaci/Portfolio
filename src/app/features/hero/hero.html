<section class="hero" id="hero">
  <div class="hero-inner">
    <div class="hero-content">
      <span class="hero-label">{{ 'hero.role' | translate }}</span>

      <div class="hero-title-group">
        <h1 class="hero-title">Berk Çapacı</h1>
        <div class="hero-buttons">
          <a href="#" class="btn" (click)="onCheckWorkClick($event)">
            <span class="btn-text">{{ 'hero.checkWork' | translate }}</span>
          </a>
          <a href="#" class="btn" (click)="onContactClick($event)">
            <span class="btn-text">{{ 'hero.contactMe' | translate }}</span>
          </a>
        </div>
      </div>
    </div>

    <div class="scroll-indicator">
      <div class="arrow-circle">
        <img src="icons/scroll-arrow.svg" alt="" class="scroll-dot" />
      </div>
      <div class="indicator-line"></div>
    </div>

    <a href="mailto:berkcapaci.de@gmail.com" class="hero-email">berkcapaci.de&#64;gmail.com</a>
    <div class="hero-social-icons">
      <a
        href="https://github.com/berkcapaci"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
        class="social-icon"
      >
        <img src="icons/github.svg" alt="" class="icon-default" />
        <img src="icons/github_hover.svg" alt="" class="icon-hover" />
        <span class="hover-dot"></span>
      </a>
      <a
        href="https://www.linkedin.com/in/berkcapaci/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
        class="social-icon"
      >
        <img src="icons/linkedin.svg" alt="" class="icon-default" />
        <img src="icons/linkedin_hover.svg" alt="" class="icon-hover" />
        <span class="hover-dot"></span>
      </a>
      <div class="social-line"></div>
    </div>
  </div>

  <div class="marquee" aria-hidden="true">
    <div class="marquee-track" [style.--marquee-duration]="marqueeDuration() + 's'">
      @for (group of [0, 1]; track group) {
        <div class="marquee-group" #marqueeGroup>
          @for (repeat of groupRepeats(); track repeat) {
            @for (item of tickerItems(); track $index) {
              <span class="dot"></span>
              <span class="marquee-text">{{ item }}</span>
            }
          }
        </div>
      }
    </div>
  </div>
</section>
